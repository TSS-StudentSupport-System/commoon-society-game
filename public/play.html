<!doctype html>
<html lang="th" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2457A7">
  <title>มูนสคูล · COMMOON SOCIETY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-theme="day">
  <main class="phone">
    <header class="phone-top pframe">
      <span class="pixel-title">COMMOON SOCIETY</span>
      <span class="tag" id="roomTag"></span>
    </header>

    <div id="connecting" class="center-msg pframe"><div class="big">กำลังเชื่อมต่อ…</div></div>

    <form id="joinView" class="pframe hidden" style="padding:1.2rem">
      <h2 class="thai-head" style="margin-top:0">เข้าร่วมห้อง</h2>
      <div class="field"><label for="jCode">รหัสห้อง</label><input id="jCode" maxlength="8" autocomplete="off" autocapitalize="characters" required style="font-family:var(--font-pixel);letter-spacing:.2em;text-transform:uppercase"></div>
      <div class="field"><label for="jNick">ตั้งชื่อตัวละคร</label><input id="jNick" maxlength="32" autocomplete="off" required placeholder="เช่น ฟ้าคราม, ต้นข้าว"></div>
      <p class="muted" style="font-size:.88rem;margin-top:-.3rem">⚠️ ห้ามใช้ชื่อจริงหรือชื่อเล่นจริง ตัวละครนี้ไม่ใช่ตัวคุณ</p>
      <button class="btn warm" style="width:100%" type="submit">เข้าร่วม</button>
    </form>

    <section id="lobbyView" class="hidden" style="display:grid;gap:1rem">
      <div class="me pframe"><canvas id="meAvatar"></canvas><div><div class="muted">ตัวละครของคุณ</div><div class="nick" id="meNick"></div><div class="muted" style="font-size:.9rem">รอเริ่มเกม</div></div></div>
      <button class="btn ready-btn" id="readyBtn">กดเพื่อ “พร้อม”</button>
      <div class="phone-players pframe"><strong id="lobbyCount"></strong><div class="mini-list" id="lobbyList"></div></div>
      <button class="btn small" id="leaveBtn" style="justify-self:center">ออกจากห้อง</button>
    </section>

    <section id="gameView" class="hidden" style="display:grid;gap:.8rem">
      <div class="phone-phase pframe">
        <div style="min-width:0"><div class="muted" id="gRound" style="font-size:.8rem;font-weight:700"></div><div class="ptitle" id="gPhase"></div></div>
        <div class="t" id="gTimer">0:00</div>
      </div>
      <div class="attr-strip pframe" id="attrStrip"></div>
      <div id="tab-act" class="tab"></div>
      <div id="tab-hand" class="tab hidden"><p class="muted" style="margin:0 0 .6rem;font-size:.9rem;text-align:center">🤫 บทบาททุกคนเห็นได้ แต่คุณลักษณะเป็นความลับ อย่าให้เพื่อนเห็น</p><div class="hand" id="hand"></div></div>
      <div id="tab-friends" class="tab hidden"></div>
      <div id="tab-diary" class="tab hidden"><div class="pframe diary" id="diary"></div></div>
    </section>

    <section id="msgView" class="center-msg pframe hidden"><div class="big" id="msgText"></div><p><a class="btn primary" href="/">กลับหน้าแรก</a></p></section>
  </main>

  <nav class="tabbar pframe hidden" id="tabbar">
    <button data-tab="act" class="on">🎯<span>ตอนนี้</span></button>
    <button data-tab="hand">🃏<span>การ์ด</span></button>
    <button data-tab="friends">❤<span>เพื่อน</span></button>
    <button data-tab="diary">📓<span>บันทึก</span></button>
  </nav>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
